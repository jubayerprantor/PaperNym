app-id: io.github.jubayerprantor.PaperNym
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: papernym-gui

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --filesystem=xdg-download:rw
  - --filesystem=xdg-documents:rw
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: papernym
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links=file://${PWD} --prefix=${FLATPAK_DEST} papernym[gui]
      - install -Dm644 packaging/io.github.jubayerprantor.PaperNym.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.jubayerprantor.PaperNym.metainfo.xml
      - install -Dm644 assets/papernym-icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.jubayerprantor.PaperNym.svg
      - install -Dm644 assets/papernym-icon-1024.png ${FLATPAK_DEST}/share/icons/hicolor/1024x1024/apps/io.github.jubayerprantor.PaperNym.png
    sources:
      - type: dir
        path: ../

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "papernym"
dynamic = ["version"]
description = "Rename academic paper PDFs using scholarly metadata"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Xatta-Trone"}]
dependencies = [
    "keyring>=24",
    "pypdfium2>=4.30",
    "requests>=2.28",
    "watchdog>=3.0",
]

[project.urls]
Homepage = "https://github.com/jubayerprantor/PaperNym"
Issues = "https://github.com/jubayerprantor/PaperNym/issues"
Releases = "https://github.com/jubayerprantor/PaperNym/releases"

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]
# Windows app build (scripts/build_windows.py); Inno Setup 6 is installed separately
build = ["pyinstaller>=6.10"]

[project.scripts]
papernym = "papernym.cli:main"

[project.gui-scripts]
papernym-gui = "papernym.gui.app:main"

[tool.setuptools.dynamic]
version = {attr = "papernym.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"papernym.gui" = ["icons/*.png", "icons/*.ico", "icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "prototype",
    "sample_pdfs",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
]
ignore = [
    "E501",
]

[tool.coverage.run]
source = ["src/papernym"]
omit = [
    "src/papernym/__main__.py",
    "src/papernym/gui/__main__.py",
]

[tool.coverage.report]
show_missing = true

name: Bug Report
description: Report an error, crash, or unexpected behavior in PaperNym
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please ensure you do not include sensitive data or proprietary PDF contents.
  - type: input
    id: version
    attributes:
      label: PaperNym Version
      description: Run `papernym --version` or check the Help/About dialog.
      placeholder: e.g. 0.1.4
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Ubuntu / Debian (.deb)
        - Linux (AppImage)
        - macOS
        - Pip / Pipx
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Download PDF ...
        2. Move to watched folder ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log Output / Terminal Output
      description: Run with `--debug` and paste relevant log lines here.
      render: shell
